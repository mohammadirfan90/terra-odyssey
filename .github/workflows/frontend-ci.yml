name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'terra-odyssey/src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terra-odyssey/src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Build & Verify (Node 20 on ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terra-odyssey/src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: terra-odyssey/src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Build Next.js static export
        run: npm run build
