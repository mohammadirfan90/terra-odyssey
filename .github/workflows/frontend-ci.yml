name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'terra-odyssey/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terra-odyssey/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Build & Verify (Node 22 on ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terra-odyssey/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: terra-odyssey/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Build Next.js static export
        run: npm run build
