name: Feature Request
description: Propose a new feature, dataset adapter, or visualization enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing a new feature for Terra Odyssey!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
